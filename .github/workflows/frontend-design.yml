name: Frontend design checks
on:
  push:
    branches: [frontend-design]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:design
      - run: npm run test:otp
      - run: npm run build
      - name: Check frontend-only snapshot
        run: test ! -d server-contoh
