name: Backend and frontend regression checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'server-contoh/**'
      - 'src/**'
      - '.github/workflows/backend-phase-3c-check.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'
      - 'public/**'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: server-contoh
        run: npm install --no-audit --no-fund
      - name: Backend regression tests
        working-directory: server-contoh
        run: npm test
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Frontend production build (Pages base)
        env:
          GITHUB_PAGES: 'true'
          VITE_API_URL: ''
        run: npm run build
