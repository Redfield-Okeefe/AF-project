name: Backend and frontend regression checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'server-contoh/**'
      - 'src/**'
      - '.github/workflows/backend-phase-3c-check.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'
      - 'public/**'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bnr_ci
          POSTGRES_PASSWORD: bnr_ci_fixture_only
          POSTGRES_DB: bnr_academy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bnr_ci -d bnr_academy_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: server-contoh
        run: |
          npm install --no-audit --no-fund --include=optional
          # Lockfile was generated on Windows; install the matching Linux native runtime in CI only.
          npm install --no-save --package-lock=false --no-audit --no-fund @img/sharp-linux-x64@0.34.5 @img/sharp-libvips-linux-x64@1.2.4
          node --input-type=module -e "import sharp from 'sharp'; console.log('sharp native runtime', sharp.versions.sharp)"
      - name: Backend regression tests
        working-directory: server-contoh
        run: npm test
      - name: PostgreSQL academy integration tests (isolated fixture)
        working-directory: server-contoh
        env:
          ACADEMY_TEST_DATABASE_URL: postgresql://bnr_ci:bnr_ci_fixture_only@127.0.0.1:5432/bnr_academy_ci
        run: npm run test:academy-db
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Frontend OTP contract tests
        run: npm run test:otp
      - name: Frontend design preview tests
        run: npm run test:design
      - name: Verify Vite local API mode
        run: |
          node --input-type=module <<'JS'
          import {createServer} from 'vite';
          const server=await createServer({mode:'local-api',server:{middlewareMode:true,watch:null}});
          try {const r=await server.transformRequest('/src/services/otp.js');if(!r?.code.includes('http://127.0.0.1:3001'))throw Error('Local API URL not injected');console.log('Local API mode verified');} finally {await server.close();}
          JS
      - name: Verify isolated design preview mode
        run: |
          node --input-type=module <<'JS'
          import {createServer} from 'vite';
          const server=await createServer({mode:'design-preview',server:{middlewareMode:true,watch:null}});
          try {const r=await server.transformRequest('/src/services/academy.js');if(!r?.code.includes('createAcademyPreview'))throw Error('Preview adapter missing'); console.log('Design preview module verified');} finally {await server.close();}
          JS
      - name: Frontend production build (Pages base)
        env:
          GITHUB_PAGES: 'true'
          VITE_API_URL: ''
        run: npm run build
